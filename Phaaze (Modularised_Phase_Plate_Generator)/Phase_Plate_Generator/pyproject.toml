[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-plate-generator"
version = "0.1.0"
description = "Modular Gerchberg-Saxton phase-plate design and facility input decks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.8"]

[project.scripts]
phase-plate = "phase_plate_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
